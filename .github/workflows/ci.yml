name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.8', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v
      - run: python powerk.py selftest

  web:
    name: Web UI and design guidelines
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node --test tests/*.test.cjs

  android:
    name: Android tests, lint and debug APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager 'platforms;android-37.0'
      - uses: gradle/actions/setup-gradle@v4
      - run: bash gradlew testDebugUnitTest lintDebug assembleDebug --no-daemon
        working-directory: android
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-reports
          path: android/app/build/reports/
      - uses: actions/upload-artifact@v4
        with:
          name: powerk-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
